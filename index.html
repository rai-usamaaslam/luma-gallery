<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>LUMA — Interactive Lighting Gallery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="navbar">
      <a href="#" class="logo">LUMA</a>

      <nav class="nav-links">
        <a href="#collection">Collection</a>
        <a href="#experience">Experience</a>
        <a href="#about">About</a>
      </nav>

      <a href="#collection" class="nav-cta"> Explore </a>
    </header>
    <main>
      <section class="hero">
        <div class="hero-overlay"></div>

        <div class="hero-content">
          <p class="hero-label">INTERACTIVE LIGHTING GALLERY</p>

          <h1>
            Light<br />
            Your<br />
            Space
          </h1>

          <p class="hero-description">
            Discover lighting designed to transform the atmosphere around you.
          </p>

          <a href="#collection" class="hero-button"> Explore Collection </a>
        </div>
      </section>
      <!-- Interactive Lamp -->

      <section class="interactive-lamp" id="experience">
        <div class="lamp-intro">
          <p class="section-label">THE EXPERIENCE</p>

          <h2>
            Turn on<br />
            the light.
          </h2>

          <p>
            Experience how a single source of light can completely transform an
            atmosphere.
          </p>
        </div>

        <div class="lamp-stage">
          <div class="light-glow"></div>

          <div class="lamp">
            <div class="lamp-shade"></div>

            <div class="lamp-neck"></div>

            <div class="lamp-base"></div>
          </div>

          <button class="lamp-switch" id="lampSwitch">
            <span class="switch-dot"></span>
            <span class="switch-text">OFF</span>
          </button>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
